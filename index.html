<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Insumos OXXO - Región Jalisco</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
.header{background:#E30613;color:white;padding:14px 10px;position:sticky;top:0;z-index:10}
.header h1{font-size:18px;font-weight:900}
.badge{background:#FFD400;color:black;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:800;float:right;margin-top:-20px}
.tabs-container{display:flex;justify-content:flex-end;gap:8px;padding:10px;background:#f5f5f5;overflow-x:auto;white-space:nowrap;border-bottom:2px solid #ddd}
.tabs-container::-webkit-scrollbar{display:none}
.tab{padding:10px 16px;border-radius:20px;border:none;font-weight:800;font-size:13px;cursor:pointer;flex-shrink:0}
.tab.active{background:#FFD400;color:#b00000;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tab.inactive{background:#E30613;color:white}
.arrow{font-size:20px;color:#888;padding:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#2196F3;color:white;padding:10px 6px;font-size:11px}
td{padding:8px 6px;border-bottom:1px solid #e0e0e0;text-align:center}
td:nth-child(2){text-align:left;font-weight:700}
input{width:50px;padding:6px;text-align:center;border-radius:8px;border:1px solid #ccc}
.total-bar{background:#111;color:#FFD400;padding:12px;text-align:center;font-weight:900;font-size:14px}
.btn-limpiar{background:#FFD400;border:none;width:95%;margin:10px auto;display:block;padding:14px;border-radius:30px;font-weight:900;font-size:16px}
.hint{font-size:11px;color:#666;padding:6px 12px}
</style>
</head>
<body>
<div class="header">
<h1>CALCULADORA INSUMOS OXXO</h1>
<span class="badge">REGIÓN JALISCO</span>
</div>

<div class="tabs-container">
<button class="tab active" onclick="showTab('cafe')">01 CAFÉ</button>
<button class="tab inactive" onclick="showTab('capu')">02 CAPUCHINOS Y BASE</button>
<span class="arrow">›</span>
</div>
<div class="hint">Desliza horizontalmente ▶ para cambiar de categoría</div>

<div id="tab-cafe">
<table>
<thead>
<tr><th>CODIGO</th><th>01 CAFÉ</th><th>FACTOR</th><th>BOLSAS</th><th>EXTRAS</th><th>TOTAL</th></tr>
</thead>
<tbody>
<tr><td>7456</td><td>ONZA DE CAFÉ GRANO</td><td>788</td><td><input type="number" value="0" oninput="calc()" id="b1"></td><td><input type="number" value="0" oninput="calc()" id="e1"></td><td id="t1">0</td></tr>
<tr><td>33421</td><td>OZMEZCLASMEXICAVCZ</td><td>60</td><td><input type="number" value="0" oninput="calc()" id="b2"></td
