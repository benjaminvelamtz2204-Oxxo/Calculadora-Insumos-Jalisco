<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora OXXO - Jalisco</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f2f2f2}.header{background:#E30613;color:white;padding:16px;text-align:center;font-weight:bold;font-size:18px}.card{background:#FFC933;border-radius:18px;margin:12px;padding:16px}.card h3{color:white;margin:10px 0}.admin{background:#3F3AB7}.page{display:none;padding:12px}.page.active{display:block}input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc}button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin-top:8px} .btn-red{background:#E30613;color:white}.btn-yellow{background:#FFC933}.result{background:white;border-radius:12px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<div class="header">CALCULADORA INSUMOS - OXXO JALISCO</div>

<div id="p1" class="page active">
<div class="card"><h3>🧮 Calculadora Insumos</h3><p>Calcula cuántos insumos necesitas por venta</p><button class="btn-red" onclick="show('p2')">Entrar</button></div>
<div class="card admin"><h3>👑 Administración</h3><button class="btn-yellow" onclick="show('admin')">Entrar como admin</button></div>
</div>

<div id="p2" class="page">
<h3>Calculadora</h3>
<input id="ventas" type="number" placeholder="Ventas del día">
<input id="precio" type="number" placeholder="Precio por insumo">
<button class="btn-red" onclick="calcular()">Calcular</button>
<div id="res" class="result"></div>
<button onclick="show('p1')">Volver</button>
</div>

<div id="admin" class="page">
<h3>Login Admin</h3>
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button class="btn-red" onclick="login()">Entrar</button>
<button onclick="show('p1')">Volver</button>
</div>

<script>
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
function calcular(){let v=document.getElementById('ventas').value;let p=document.getElementById('precio').value;if(!v||!p){alert('Llena los datos');return}let t=v*p;document.getElementById('res').innerHTML='<b>Total insumos: $'+t+'</b>'}
function login(){let u=document.getElementById('user').value;let pw=document.getElementById('pass').value;if(u=='admin'&&pw=='oxxo123'){alert('Bienvenido admin')}else{alert('Usuario incorrecto')}}
</script>
</body>
</html>
