<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OXXO Jalisco</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f2f2f2}.h{background:#E30613;color:#fff;padding:16px;text-align:center;font-weight:900}.c{background:#FFC933;border-radius:18px;margin:12px;padding:16px;text-align:center}.b{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;margin-top:8px}.r{background:#E30613;color:#fff}.y{background:#FFD700}.p{display:none;padding:12px}.p.a{display:block}input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc}.res{background:#fff;border-radius:12px;padding:12px;margin-top:12px}.admin{background:#3F3AB7;color:#fff}</style></head><body><div class="h">CALCULADORA OXXO JALISCO</div><div id="p1" class="p a"><div class="c"><h3>🧮 Calculadora</h3><button class="b r" onclick="s('p2')">Entrar</button></div><div class="c admin"><h3>👑 Admin</h3><button class="b y" onclick="s('ad')">Entrar</button></div></div><div id="p2" class="p"><h3>Calculadora</h3><input id="v" type="number" placeholder="Ventas"><input id="pr" type="number" placeholder="Precio"><button class="b r" onclick="calc()">Calcular</button><div id="r" class="res"></div><button class="b" onclick="s('p1')">Volver</button></div><div id="ad" class="p"><h3>Admin</h3><input id="u" placeholder="Usuario"><input id="pw" type="password" placeholder="Contraseña"><button class="b r" onclick="log()">Entrar</button><button class="b" onclick="s('p1')">Volver</button></div><script>function s(id){document.querySelectorAll('.p').forEach(x=>x.classList.remove('a'));document.getElementById(id).classList.add('a')}function calc(){let a=document.getElementById('v').value,b=document.getElementById('pr').value;if(!a||!b)return alert('Llena datos');document.getElementById('r').innerHTML='<b>Total: $'+(a*b)+'</b>'}function log(){let u=document.getElementById('u').value,p=document.getElementById('pw').value;if(u=='admin'&&p=='oxxo123')alert('Bienvenido');else alert('Incorrecto')}</script></body></html>
